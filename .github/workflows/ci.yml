name: KeyForge CI & Security Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Windows Test & Security Linter (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Static Linter & Security Rules
        run: |
          python -m ruff check keyforge tests
          python -m ruff format --check keyforge tests

      - name: Run Unit, Security & Engine Tests
        run: |
          python -m pytest -k "not test_gui_controller_lifecycle" --cov=keyforge --cov-report=term-missing
