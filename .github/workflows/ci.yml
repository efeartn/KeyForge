name: KeyForge Cross-Platform CI, Security & Release Compiler

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-compile:
    name: Rust Lint, Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Rust Toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Crates & Build Target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux X11/XTest Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst6 libx11-6 xvfb

      - name: Check Formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy Static Linter (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Full Rust Test Suite (Non-Linux)
        if: runner.os != 'Linux'
        run: cargo test --all-targets

      - name: Run Full Rust Test Suite (Linux / Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --all-targets

      - name: Compile Release Binary
        run: cargo build --release --locked

      - name: Package Platform Binaries & SHA-256 Checksums
        shell: bash
        run: |
          mkdir -p dist
          OS="${{ runner.os }}"
          ARCH=$(uname -m)
          if [ "$OS" = "Windows" ]; then
            cp target/release/keyforge.exe dist/KeyForge-Windows-x64.exe
            cp target/release/keyforge.exe dist/KeyForge-Setup-Windows-x64.exe
          elif [ "$OS" = "macOS" ]; then
            if [ "$ARCH" = "arm64" ]; then
              cp target/release/keyforge dist/KeyForge-macOS-arm64
            else
              cp target/release/keyforge dist/KeyForge-macOS-x64
            fi
          else
            if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
              cp target/release/keyforge dist/KeyForge-Linux-arm64
            else
              cp target/release/keyforge dist/KeyForge-Linux-x64
            fi
          fi

          (
            cd dist
            for f in *; do
              [ -f "$f" ] || continue
              chmod +x "$f" || true
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" > "${f}.sha256.txt"
              else
                shasum -a 256 "$f" > "${f}.sha256.txt"
              fi
            done
          )
          ls -lh dist/

      - name: Smoke-Test Compiled Release Binary
        shell: bash
        run: |
          BIN=$(find dist -maxdepth 1 -type f ! -name "*.txt" ! -name "*Setup*" | head -n 1)
          "$BIN" --version
          "$BIN" --expr "Press E -> Wait 50ms -> Click -> Press 1" --repeat 2 --dry-run

      - name: Upload Compiled Binary & SHA-256 Checksum Artifact
        uses: actions/upload-artifact@v6
        with:
          name: KeyForge-Binaries-${{ matrix.os }}
          path: |
            dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Binaries
    needs: [test-and-compile]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Notes
        uses: actions/checkout@v5

      - name: Download All Compiled Platform Binaries
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Combined SHA256SUMS.txt
        run: |
          cd release-assets
          cat *.sha256.txt > SHA256SUMS.txt
          ls -lh

      - name: Resolve Release Codename & Sync Historical Releases
        id: codename
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: python3 .github/scripts/sync_release_codenames.py

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.codename.outputs.release_title }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            release-assets/*
