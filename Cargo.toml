[package]
name = "ktap"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "kTap — Minimalist Native Rust Keyboard & Macro Sequence Studio and Live Input Recorder"
repository = "https://github.com/efeartn/kTap"
build = "build.rs"

[lib]
name = "ktap"
path = "src/lib.rs"

[[bin]]
name = "ktap"
path = "src/main.rs"

[features]
screenshots = []

[[example]]
name = "capture_screenshots"
required-features = ["screenshots"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
regex = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
open = "5"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(windows, target_env = "msvc"))'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
libloading = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
